<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon for Climax: stylized sun + cloud. Scalable SVG so it looks sharp at all sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Climax favicon">
  <title>Climax</title>
  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Sun (top-right) -->
  <g transform="translate(6,2)">
    <circle cx="40" cy="12" r="9" fill="#f9c74f" />
    <!-- subtle rays -->
    <g stroke="#f9c74f" stroke-width="2" stroke-linecap="round">
      <line x1="40" y1="0" x2="40" y2="-6" transform="translate(0,6)" opacity="0.65"/>
      <line x1="40" y1="24" x2="40" y2="30" transform="translate(0,-6)" opacity="0.65"/>
      <line x1="52" y1="12" x2="58" y2="12" transform="translate(-14,0)" opacity="0.65"/>
      <line x1="28" y1="12" x2="22" y2="12" transform="translate(6,0)" opacity="0.65"/>
    </g>
  </g>

  <!-- Cloud (center-left) -->
  <g transform="translate(0,8)">
    <path d="M14 34h30a6 6 0 0 0 0-12c-.3 0-.6 0-.9.05A10 10 0 0 0 28 16a11 11 0 0 0-11 11c0 .3 0 .6.02.9A6 6 0 0 0 14 34z" fill="#ffffff"/>
    <!-- outline to increase contrast on light/dark backgrounds -->
    <path d="M14 34h30a6 6 0 0 0 0-12c-.3 0-.6 0-.9.05A10 10 0 0 0 28 16a11 11 0 0 0-11 11c0 .3 0 .6.02.9A6 6 0 0 0 14 34z" fill="none" stroke="#e6eef7" stroke-opacity="0.6" stroke-width="1"/>
  </g>
</svg>
